<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMAxFORGE - مینیوی سەرەکی</title>
    <style>
        body {
            background-color: #050b08;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .logo-container h1 {
            font-size: 26px;
            margin: 0;
            font-weight: bold;
            color: #ffffff;
        }
        .logo-container h1 span {
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
        .sub-text {
            font-size: 11px;
            color: #00cc55;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 20px;
        }
        .menu-box {
            background-color: #0a140f;
            border: 1px solid #00ff6655;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 13px;
            color: #00ff66;
            text-align: right;
            direction: rtl;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.15);
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #00ff6622;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .btn {
            width: 100%;
            max-width: 320px;
            padding: 13px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-back {
            background-color: #0a140f;
            color: #ffffff;
            border: 1px solid #00ff6644;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <h1>HAMA<span>xFORGE</span></h1>
        <div class="sub-text">VIP MENU · HACK PANEL</div>
    </div>

    <div class="menu-box">
        <div class="menu-item">
            <span>دەستکاری Dylib</span>
            <span style="color: #ffffff;">[ چالاک ]</span>
        </div>
        <div class="menu-item">
            <span>دابەزاندنی هاک (ESign)</span>
            <span style="color: #ffffff;">[ ئامادە ]</span>
        </div>
        <div class="menu-item">
            <span>پشتیوانی جیلبڕیک</span>
            <span style="color: #ffffff;">[ بێ کێشە ]</span>
        </div>
    </div>

    <a href="index.html" class="btn btn-back">
        <span>گەڕانەوە بۆ سەرەتا</span>
    </a>

</body>
</html>
